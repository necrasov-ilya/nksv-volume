<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>volume</title>
  <meta name="color-scheme" content="light dark">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section class="landing" id="landing">
    <main class="landing-content">
      <button class="landing-secret" id="landing-secret" type="button" aria-label="Статус">
        <i class="ti ti-inbox landing-icon" aria-hidden="true"></i>
      </button>
      <h1>Привет!</h1>
      <p class="landing-lead">Тебе пока ничего не отправили.</p>
    </main>
  </section>

  <div class="auth-overlay" id="auth-overlay" hidden>
    <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button class="icon-button auth-close" id="auth-close" type="button" aria-label="Закрыть">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
      <p class="eyebrow">Для владельца</p>
      <h2 id="auth-title">Войти в volume</h2>
      <p class="auth-note">Управление файлами доступно только владельцу.</p>
      <form id="auth-form">
        <label for="auth-input">Пароль</label>
        <input type="password" id="auth-input" name="password" autocomplete="current-password" required>
        <p class="form-error" id="auth-error" role="alert" aria-live="polite"></p>
        <button class="primary-button auth-submit" type="submit">Войти</button>
      </form>
    </section>
  </div>

  <section class="admin" id="admin" hidden>
    <button class="admin-logout" id="btn-logout" type="button">Выйти</button>

    <div class="app-shell">
      <main class="workspace">
        <div class="workspace-heading">
          <div class="workspace-title-row">
            <h1>Файлы</h1>
            <p class="storage-usage" id="storage-usage">— из 20 ГБ</p>
          </div>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Навигация по папкам"></nav>
        </div>

        <div class="toolbar" aria-label="Действия с файлами">
          <div class="add-menu-wrap">
            <button class="primary-button" id="btn-add" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu">
              <i class="ti ti-plus" aria-hidden="true"></i>
              Добавить
              <i class="ti ti-chevron-down add-menu-chevron" aria-hidden="true"></i>
            </button>
            <div class="add-menu" id="add-menu" role="menu" hidden>
              <button class="add-menu-item" id="add-upload" type="button" role="menuitem">
                <i class="ti ti-upload" aria-hidden="true"></i>
                <span>
                  Загрузить файлы
                  <small id="upload-limits">PNG, JPG, WebP, GIF, PDF, MP4, WebM, MKV · до 200 МБ</small>
                </span>
              </button>
              <button class="add-menu-item" id="add-folder" type="button" role="menuitem">
                <i class="ti ti-folder-plus" aria-hidden="true"></i>
                <span>Новая папка</span>
              </button>
              <button class="add-menu-item" id="add-article" type="button" role="menuitem">
                <i class="ti ti-article" aria-hidden="true"></i>
                <span>Новая статья</span>
              </button>
            </div>
          </div>
          <input type="file" id="file-input" multiple hidden>
        </div>

        <div class="drag-overlay" id="drag-overlay" hidden aria-hidden="true">
          <div class="drag-overlay-inner">
            <i class="ti ti-upload" aria-hidden="true"></i>
            <p>Отпустите, чтобы загрузить</p>
          </div>
        </div>

        <div class="upload-progress" id="upload-progress" hidden>
          <div class="progress-copy">
            <span id="progress-label">Загрузка…</span>
            <span id="progress-value">0%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <section class="file-browser" aria-live="polite">
          <p class="list-label" id="list-label">Сегодня</p>
          <div class="file-list" id="file-list"></div>
        </section>
      </main>

      <aside class="detail-panel" id="detail-panel" aria-live="polite">
        <div class="detail-empty">
          <i class="ti ti-file" aria-hidden="true"></i>
          <p>Выберите файл, чтобы посмотреть его и скопировать ссылку.</p>
        </div>
      </aside>
    </div>
  </section>

  <dialog class="folder-dialog" id="folder-dialog">
    <form id="folder-form" method="dialog">
      <div class="dialog-heading">
        <h2>Новая папка</h2>
        <button class="icon-button" id="folder-dialog-close" type="button" aria-label="Закрыть">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <label for="folder-name">Название</label>
      <input id="folder-name" name="name" maxlength="120" autocomplete="off" required>
      <div class="dialog-actions">
        <button class="quiet-button" id="folder-cancel" type="button">Отмена</button>
        <button class="primary-button" type="submit">Создать</button>
      </div>
    </form>
  </dialog>

  <dialog class="folder-dialog" id="move-dialog">
    <form id="move-form" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Перемещение</p>
          <h2>Выберите папку</h2>
        </div>
        <button class="icon-button" id="move-dialog-close" type="button" aria-label="Закрыть">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <p class="move-file-name" id="move-file-name"></p>
      <label for="move-target">Куда переместить</label>
      <select id="move-target" name="folderId"></select>
      <div class="dialog-actions">
        <button class="quiet-button" id="move-cancel" type="button">Отмена</button>
        <button class="primary-button" type="submit">Переместить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="corner-actions">
    <a class="github-link" href="https://github.com/necrasov-ilya/nksv-volume" target="_blank" rel="noopener noreferrer">
      <i class="ti ti-brand-github" aria-hidden="true"></i>
      GitHub
    </a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Сменить тему" title="Сменить тему">
      <i class="ti ti-moon" aria-hidden="true"></i>
    </button>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
